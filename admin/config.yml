backend:
  name: git-gateway
  branch: main

local_backend: false

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

collections:
  - name: "inventory"
    label: "Car Inventory"
    files:
      - name: "cars"
        label: "Cars"
        file: "data/cars.json"
        format: "json"
        fields:
          - label: "Cars"
            name: "cars"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Price"
                name: "price"
                widget: "string"
              - label: "Specs"
                name: "specs"
                widget: "string"
